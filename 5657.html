<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детектор вибрации</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f0f0f0; }
        #status { margin-top: 20px; font-weight: bold; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <button id="startBtn">Включить детектор</button>
    <div id="status">Статус: Ожидание активации</div>

    <audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

    <script>
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const audio = document.getElementById('alarmSound');
        
        // Порог чувствительности (подбирается экспериментально)
        const THRESHOLD = 1; 

        startBtn.addEventListener('click', async () => {
            // Запрос разрешения для iOS
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        startTracking();
                    } else {
                        statusDiv.innerText = "Доступ запрещен";
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                // Для Android и десктопов
                startTracking();
            }
        });

        function startTracking() {
            statusDiv.innerText = "Статус: Слушаю вибрации...";
            startBtn.style.display = 'none';

            window.addEventListener('devicemotion', (event) => {
                const acc = event.accelerationIncludingGravity;
                if (!acc) return;

                // Вычисляем общую силу движения
                const totalAcceleration = Math.sqrt(acc.x ** 2 + acc.y ** 2 + acc.z ** 2);

                if (totalAcceleration > THRESHOLD) {
                    statusDiv.innerText = "Статус: ВИБРАЦИЯ ОБНАРУЖЕНА!";
                    statusDiv.style.color = "red";
                    
                    // Воспроизводим звук
                    audio.play();

                    // Сбрасываем цвет через полсекунды
                    setTimeout(() => {
                        statusDiv.style.color = "black";
                        statusDiv.innerText = "Статус: Слушаю вибрации...";
                    }, 500);
                }
            });
        }
    </script>
</body>
</html>
